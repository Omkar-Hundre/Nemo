<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nemo Remote</title>
  <meta name="description" content="Nemo Mobile Remote Controller">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nemo">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2309090b'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%2338bdf8'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%2338bdf8' stroke-width='4' opacity='0.4'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2309090b'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%2338bdf8'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%2338bdf8' stroke-width='4' opacity='0.4'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #111114;
      --card-hover: #15151a;
      --border: #1f1f23;
      --border-focus: #3f3f46;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimal status line instead of heavy topbar */
    .status-bar {
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 20px 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }

    .brand-mark {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      transition: background 0.2s ease;
    }

    .status-dot.working {
      background: var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Main conversation container */
    main {
      flex: 1;
      padding: 12px 16px 140px 16px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      text-align: center;
      margin: auto 0;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    .task-feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s ease;
    }

    .card.running {
      border-color: rgba(56, 189, 248, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .prompt-text {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      letter-spacing: -0.2px;
    }

    .time-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .result-box {
      font-size: 0.86rem;
      line-height: 1.55;
      color: #d4d4d8;
      background: #000000;
      border: 1px solid #18181b;
      border-radius: 8px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .result-box.running {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.04);
      border-color: rgba(56, 189, 248, 0.15);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-box.pending {
      color: var(--warning);
      background: rgba(245, 158, 11, 0.04);
      border-color: rgba(245, 158, 11, 0.15);
      font-size: 0.82rem;
    }

    .result-box.failed {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.04);
      border-color: rgba(239, 68, 68, 0.15);
      font-size: 0.82rem;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #18181b;
      border: 1px solid #27272a;
      color: var(--text-dim);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.15s ease;
      z-index: 5;
    }

    .copy-btn:hover, .copy-btn:active {
      opacity: 1;
      color: var(--text);
      background: #27272a;
    }

    /* Screen snapshot preview card */
    .snapshot-wrap {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      background: #000000;
    }

    .snapshot-preview {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }

    .snapshot-wrap:hover .snapshot-preview {
      transform: scale(1.01);
    }

    .snapshot-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: #e4e4e7;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%);
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      cursor: zoom-out;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #18181b;
      border: 1px solid #27272a;
      color: #fff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }

    /* Fixed bottom container */
    .bottom-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 16px calc(env(safe-area-inset-bottom, 16px) + 8px) 16px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .chips-bar {
      max-width: 680px;
      width: 100%;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
    }

    .chips-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #141417;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .chip:hover, .chip:active {
      background: #1e1e24;
      border-color: var(--border-focus);
      color: var(--text);
    }

    .input-pill {
      max-width: 680px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #141417;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 4px 6px 4px 12px;
      transition: border-color 0.15s ease;
    }

    .input-pill:focus-within {
      border-color: var(--border-focus);
    }

    .main-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      padding: 8px 4px;
    }

    .main-input::placeholder {
      color: var(--text-dim);
    }

    .btn-icon {
      background: transparent;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.15s ease;
    }

    .btn-icon:hover, .btn-icon:active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-mic.recording {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
      animation: pulse 1s infinite;
    }

    .btn-send {
      background: var(--text);
      color: var(--bg);
    }

    .btn-send:hover, .btn-send:active {
      background: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- Minimal status header -->
  <div class="status-bar">
    <div class="brand-mark">
      <span>nemo</span>
    </div>
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">ready</span>
    </div>
  </div>

  <!-- Messages stream -->
  <main>
    <div id="taskFeed" class="task-feed">
      <div class="empty-state">Send a command or tap mic to speak.</div>
    </div>
  </main>

  <!-- Fullscreen Lightbox Modal -->
  <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Screen Snapshot" />
  </div>

  <!-- Bottom action pill -->
  <div class="bottom-area">
    <div class="chips-bar">
      <button class="chip" onclick="sendPrompt('send me a snapshot of the screen')">Screen snapshot</button>
      <button class="chip" onclick="sendPrompt('play some music from my music folder')">Play local music</button>
      <button class="chip" onclick="sendPrompt('can you check recent posts in my placement group and tell me if i need to apply to some')">Placement scan</button>
      <button class="chip" onclick="sendPrompt('go apply to those with my details and later inform me once it is done')">Apply with details</button>
      <button class="chip" onclick="sendPrompt('open WhatsApp and check Bund\'s chat')">WhatsApp Bundu</button>
      <button class="chip" onclick="sendPrompt('can you open goutams chat in whatsapp')">WhatsApp Gautam</button>
      <button class="chip" onclick="sendPrompt('what are you doing right now')">Status</button>
    </div>

    <div class="input-pill">
      <button class="btn-icon btn-mic" id="micBtn" onclick="toggleMic()" title="Voice Dictation">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <input type="text" class="main-input" id="promptInput" placeholder="Command Nemo..." onkeypress="if(event.key === 'Enter') submitPrompt()">

      <button class="btn-icon btn-send" id="sendBtn" onclick="submitPrompt()" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jdrcwujxrtxcyahigbmi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkcmN3dWp4cnR4Y3lhaGlnYm1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjIxODAsImV4cCI6MjEwMDgzODE4MH0.siuTaRqaXE0zeZtGj-C3CcVfqa_kpSqcVYVaed6Ttss";

    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
      };

      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        document.getElementById('promptInput').value = transcript;
      };

      recognition.onerror = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };

      recognition.onend = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
    }

    function toggleMic() {
      if (!recognition) {
        alert("Microphone dictation is not supported on this browser.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        document.getElementById('promptInput').value = '';
        recognition.start();
      }
    }

    function openLightbox(src) {
      const modal = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      img.src = src;
      modal.classList.add('active');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      modal.classList.remove('active');
    }

    async function sendPrompt(text) {
      if (!text || !text.trim()) return;
      const prompt = text.trim();
      document.getElementById('promptInput').value = '';

      updateStatusUI('working', 'sending...');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_remote_tasks`, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({
            prompt: prompt,
            status: 'pending',
            device: /iPhone|iPad|Android/i.test(navigator.userAgent) ? 'phone' : 'mobile'
          })
        });
        if (res.ok) {
          loadTasks();
        }
      } catch (err) {
        console.error("Submit error:", err);
      }
    }

    function submitPrompt() {
      const val = document.getElementById('promptInput').value;
      sendPrompt(val);
    }

    function copyResult(btn, text) {
      navigator.clipboard.writeText(text);
      const original = btn.innerText;
      btn.innerText = "copied";
      setTimeout(() => { btn.innerText = original; }, 1500);
    }

    async function loadTasks() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_remote_tasks?select=*&order=created_at.desc&limit=15`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });
        if (!res.ok) return;
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        console.debug("Poll error:", err);
      }
    }

    function updateStatusUI(state, text) {
      const dot = document.getElementById('statusDot');
      const label = document.getElementById('statusLabel');
      if (state === 'working') {
        dot.className = 'status-dot working';
        label.innerText = text || 'executing';
      } else {
        dot.className = 'status-dot';
        label.innerText = text || 'ready';
      }
    }

    function renderTasks(tasks) {
      const feed = document.getElementById('taskFeed');
      if (!tasks || tasks.length === 0) {
        feed.innerHTML = '<div class="empty-state">Send a command or tap mic to speak.</div>';
        updateStatusUI('ready', 'ready');
        return;
      }

      const hasActive = tasks.some(t => t.status === 'running' || t.status === 'pending');
      if (hasActive) {
        updateStatusUI('working', 'pc executing');
      } else {
        updateStatusUI('ready', 'connected');
      }

      feed.innerHTML = tasks.map(t => {
        const timeStr = new Date(t.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const cardClass = `card ${t.status || ''}`;

        let output = '';
        if (t.result) {
          let textPortion = t.result;
          let imageHtml = '';

          // Find embedded image URI (100% resilient against newlines and formatting)
          const dataUriIdx = t.result.indexOf('data:image/');
          if (dataUriIdx !== -1) {
            let endIdx = t.result.indexOf(')', dataUriIdx);
            if (endIdx === -1) endIdx = t.result.length;
            const rawUri = t.result.substring(dataUriIdx, endIdx);
            const cleanDataUri = rawUri.replace(/[\s"'\\]+/g, '');

            textPortion = t.result.replace(/!\[[\s\S]*?\]\([\s\S]*?\)/g, '')
                                  .replace(rawUri, '')
                                  .trim();

            imageHtml = `
              <div class="snapshot-wrap" onclick="openLightbox('${cleanDataUri}')">
                <img src="${cleanDataUri}" class="snapshot-preview" alt="PC Screen Snapshot" loading="lazy" />
                <div class="snapshot-overlay">Tap to enlarge • Live Windows Screen</div>
              </div>
            `;
          }

          const rawEscaped = escapeHtml(textPortion);
          output = `
            <div class="result-box">
              <button class="copy-btn" onclick="copyResult(this, decodeURIComponent('${encodeURIComponent(t.result)}'))">copy</button>
              ${imageHtml}
              ${rawEscaped ? `<div>${rawEscaped}</div>` : ''}
            </div>
          `;
        } else if (t.error) {
          output = `<div class="result-box failed">${escapeHtml(t.error)}</div>`;
        } else if (t.status === 'running') {
          output = `<div class="result-box running"><span>●</span> Running on Windows PC...</div>`;
        } else if (t.status === 'pending') {
          output = `<div class="result-box pending">Queued — waiting for PC listener...</div>`;
        }

        return `
          <div class="${cardClass}">
            <div class="card-top">
              <div class="prompt-text">${escapeHtml(t.prompt)}</div>
              <div class="time-badge">${timeStr}</div>
            </div>
            ${output}
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initialize
    loadTasks();
    setInterval(loadTasks, 2000);
  </script>
</body>
</html>
