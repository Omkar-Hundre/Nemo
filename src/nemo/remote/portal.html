<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEMO Mobile Remote Controller</title>
  <meta name="theme-color" content="#0d1117">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --card-border: #1e293b;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --accent: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .pulse {
      animation: pulseAnim 1.8s infinite;
    }

    @keyframes pulseAnim {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    main {
      flex: 1;
      padding: 20px 16px 120px 16px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero-banner {
      background: linear-gradient(180deg, #161e31 0%, #111726 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      position: relative;
    }

    .hero-banner h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .hero-banner p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .chips-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chips-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      background: #182234;
      border: 1px solid #28354b;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .chip-btn:hover, .chip-btn:active {
      background: #233149;
      border-color: var(--primary);
      color: #fff;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .history-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .task-card.running {
      border-color: var(--primary);
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.15);
    }

    .task-card.completed {
      border-left: 4px solid var(--accent);
    }

    .task-card.failed {
      border-left: 4px solid var(--danger);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .task-prompt {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      line-height: 1.35;
    }

    .task-status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    .status-running {
      background: rgba(6, 182, 212, 0.2);
      color: var(--primary);
    }

    .status-completed {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
    }

    .status-failed {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .task-result {
      background: #090e1a;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-wrap;
      font-family: 'Inter', sans-serif;
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid #1a2233;
    }

    .task-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      align-self: flex-end;
    }

    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 16px env(safe-area-inset-bottom, 16px) 16px;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      z-index: 100;
      display: flex;
      justify-content: center;
    }

    .input-container {
      max-width: 680px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #131b2e;
      border: 1px solid #23314a;
      border-radius: 30px;
      padding: 6px 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .input-container:focus-within {
      border-color: var(--primary);
    }

    .text-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      padding: 6px 10px;
      font-family: inherit;
    }

    .btn-action {
      background: transparent;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .btn-action:hover, .btn-action:active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-mic.recording {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      animation: pulseAnim 1s infinite;
    }

    .btn-send {
      background: var(--primary);
      color: #fff;
    }

    .btn-send:hover, .btn-send:active {
      background: var(--primary-hover);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">N</div>
      <div class="brand-name">NEMO Remote</div>
    </div>
    <div class="badge-status">
      <span class="dot pulse"></span>
      <span id="connStatus">Supabase Online</span>
    </div>
  </header>

  <main>
    <div class="hero-banner">
      <h1>Phone Command Portal</h1>
      <p>Send prompts, audio dictation, or workflows directly from your phone. Nemo executes on your Windows PC and returns the output here.</p>
    </div>

    <div class="chips-section">
      <div class="chips-label">Quick Actions</div>
      <div class="chips-grid">
        <button class="chip-btn" onclick="sendPrompt('can you check recent posts in my placement group and tell me if i need to apply to some')">
          🎓 Scan Placement Group
        </button>
        <button class="chip-btn" onclick="sendPrompt('go apply to those with my details and later inform me once it is done')">
          🚀 Apply With My Details
        </button>
        <button class="chip-btn" onclick="sendPrompt('can you open goutams chat in whatsapp')">
          💬 Open Gautam's Chat
        </button>
        <button class="chip-btn" onclick="sendPrompt('open WhatsApp and check Bund\'s chat')">
          📱 Check Bundu's Chat
        </button>
        <button class="chip-btn" onclick="sendPrompt('what are you doing right now')">
          ⚡ Status & Running Tasks
        </button>
      </div>
    </div>

    <div class="history-header">
      <h2>Execution Feed</h2>
      <button class="chip-btn" style="padding: 4px 8px; font-size: 0.75rem;" onclick="loadTasks()">↻ Refresh</button>
    </div>

    <div id="taskList" class="task-list">
      <div class="empty-state">No remote tasks yet. Speak or type below to send your first command.</div>
    </div>
  </main>

  <div class="floating-bar">
    <div class="input-container">
      <button class="btn-action btn-mic" id="micBtn" onclick="toggleMic()" title="Voice Dictation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <input type="text" class="text-input" id="promptInput" placeholder="Speak or type a command for Nemo..." onkeypress="if(event.key === 'Enter') submitPrompt()">
      <button class="btn-action btn-send" id="sendBtn" onclick="submitPrompt()" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Configuration for Supabase TableTalk Project
    const SUPABASE_URL = "https://jdrcwujxrtxcyahigbmi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkcmN3dWp4cnR4Y3lhaGlnYm1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjIxODAsImV4cCI6MjEwMDgzODE4MH0.siuTaRqaXE0zeZtGj-C3CcVfqa_kpSqcVYVaed6Ttss";

    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    let recognition = null;
    let isRecording = false;

    // Initialize Web Speech API
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
      };

      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(r => r[0].transcript)
          .join('');
        document.getElementById('promptInput').value = transcript;
      };

      recognition.onerror = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };

      recognition.onend = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
    }

    function toggleMic() {
      if (!recognition) {
        alert("Speech recognition is not supported on this browser. Please type your command.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        document.getElementById('promptInput').value = '';
        recognition.start();
      }
    }

    async function sendPrompt(text) {
      if (!text || !text.trim()) return;
      const prompt = text.trim();
      document.getElementById('promptInput').value = '';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_remote_tasks`, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({
            prompt: prompt,
            status: 'pending',
            device: /iPhone|iPad|Android/i.test(navigator.userAgent) ? 'phone' : 'mobile_web'
          })
        });
        if (res.ok) {
          loadTasks();
        } else {
          console.error("Failed to post task:", await res.text());
        }
      } catch (err) {
        console.error("Network error submitting task:", err);
      }
    }

    function submitPrompt() {
      const val = document.getElementById('promptInput').value;
      sendPrompt(val);
    }

    async function loadTasks() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_remote_tasks?select=*&order=created_at.desc&limit=20`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });
        if (!res.ok) return;
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        console.debug("Fetch tasks error:", err);
      }
    }

    function renderTasks(tasks) {
      const listEl = document.getElementById('taskList');
      if (!tasks || tasks.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No remote tasks yet. Speak or type below to send your first command.</div>';
        return;
      }

      listEl.innerHTML = tasks.map(t => {
        const statusClass = `status-${t.status || 'pending'}`;
        const cardClass = `task-card ${t.status || ''}`;
        const timeStr = new Date(t.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let content = '';
        if (t.result) {
          content = `<div class="task-result">${escapeHtml(t.result)}</div>`;
        } else if (t.error) {
          content = `<div class="task-result" style="color: var(--danger);">${escapeHtml(t.error)}</div>`;
        } else if (t.status === 'running') {
          content = `<div class="task-result" style="color: var(--primary);">⚡ Nemo is currently executing this command on Windows PC...</div>`;
        } else if (t.status === 'pending') {
          content = `<div class="task-result" style="color: var(--warning);">⏳ Queued — Waiting for PC listener...</div>`;
        }

        return `
          <div class="${cardClass}">
            <div class="task-header">
              <div class="task-prompt">${escapeHtml(t.prompt)}</div>
              <span class="task-status-pill ${statusClass}">${t.status}</span>
            </div>
            ${content}
            <div class="task-time">${timeStr} • ${escapeHtml(t.device || 'mobile')}</div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Auto load and poll every 2 seconds
    loadTasks();
    setInterval(loadTasks, 2000);
  </script>
</body>
</html>
