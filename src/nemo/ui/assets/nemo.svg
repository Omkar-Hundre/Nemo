<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" class="nemo-clownfish-svg">
  <defs>
    <!-- Gradients for Nemo's Body -->
    <radialGradient id="nemoBodyGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff9100" />
      <stop offset="60%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#d84315" />
    </radialGradient>

    <!-- Gradient for Fins -->
    <linearGradient id="nemoFinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa726" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f4511e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>

    <!-- Belly Highlight -->
    <linearGradient id="nemoBellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Eye Gradient -->
    <radialGradient id="nemoEyeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb74d" />
      <stop offset="50%" stop-color="#e65100" />
      <stop offset="100%" stop-color="#3e2723" />
    </radialGradient>

    <!-- Filter for Soft Glow when Alert -->
    <filter id="nemoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="nemo-container" class="nemo-character">
    <!-- Bubble particles -->
    <g class="bubbles-group">
      <circle class="bubble bubble-1" cx="215" cy="85" r="4" fill="rgba(255,255,255,0.6)" />
      <circle class="bubble bubble-2" cx="230" cy="70" r="3" fill="rgba(255,255,255,0.5)" />
      <circle class="bubble bubble-3" cx="240" cy="95" r="5" fill="rgba(255,255,255,0.4)" />
    </g>

    <!-- Tail / Caudal Fin (Wags on swim) -->
    <g id="tail-group" class="tail-fin-anim">
      <!-- Tail fin rays / black edge -->
      <path d="M 52,90 C 35,62 10,65 14,88 C 10,112 35,118 52,90 Z" 
            fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Tail white stripe -->
      <path d="M 38,76 C 28,78 26,98 38,103 C 44,97 44,83 38,76 Z" 
            fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
      <!-- Tail fin dark fringe -->
      <path d="M 14,88 C 11,80 12,74 16,70 C 18,78 18,98 16,106 C 12,102 11,96 14,88 Z" 
            fill="#111111" />
    </g>

    <!-- Dorsal Fin (Top) -->
    <path id="dorsal-fin" class="dorsal-fin-anim"
          d="M 115,48 C 125,25 155,22 175,44 C 158,40 135,42 115,48 Z" 
          fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Dorsal fin black accent edge -->
    <path d="M 125,25 C 145,21 165,28 175,44 C 168,36 148,30 125,25 Z" fill="#111111" />

    <!-- Ventral / Pelvic Fin (Bottom) -->
    <path id="ventral-fin" 
          d="M 125,128 C 118,146 140,154 152,132 C 142,131 133,130 125,128 Z" 
          fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2" />
    <!-- Anal Fin (Rear bottom) -->
    <path id="anal-fin"
          d="M 75,115 C 65,130 85,135 95,118 C 88,116 81,115 75,115 Z"
          fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2" />

    <!-- Main Fish Body (Ocellaris Clownfish contour) -->
    <g id="main-body-group">
      <!-- Body base -->
      <path id="body-silhouette" 
            d="M 50,90 C 50,60 90,44 145,44 C 195,44 225,65 220,92 C 215,118 190,134 140,134 C 85,134 50,118 50,90 Z" 
            fill="url(#nemoBodyGrad)" stroke="#1a1a1a" stroke-width="3" />

      <!-- Belly Soft Lighting -->
      <path d="M 65,95 C 75,125 130,132 185,125 C 135,130 85,120 65,95 Z" 
            fill="url(#nemoBellyGrad)" />

      <!-- STRIPE 1: Tail Stripe (Thin curved white band near tail) -->
      <g class="stripe-tail">
        <path d="M 68,70 C 65,85 65,95 68,110 C 74,112 76,70 68,70 Z" 
              fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" />
      </g>

      <!-- STRIPE 2: Middle Saddle Stripe (Curved, wider in center) -->
      <g class="stripe-middle">
        <path d="M 125,46 C 110,65 112,110 125,132 C 135,132 144,128 138,105 C 145,95 146,80 138,65 C 142,52 135,46 125,46 Z" 
              fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
      </g>

      <!-- STRIPE 3: Head / Gill Stripe (Behind the eye) -->
      <g class="stripe-head">
        <path d="M 178,48 C 168,68 168,112 180,127 C 190,123 194,115 186,95 C 187,80 192,65 188,52 C 184,48 180,48 178,48 Z" 
              fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
      </g>

      <!-- Cute Smile / Mouth -->
      <path id="nemo-mouth" 
            d="M 215,95 C 218,99 221,100 224,98" 
            fill="none" stroke="#261005" stroke-width="2.5" stroke-linecap="round" />

      <!-- Pectoral Fin: Nemo's Expressive "Lucky Fin" (Paddles in front) -->
      <g id="pectoral-fin-group" class="pectoral-fin-anim">
        <!-- Fin outline with classic white & black curved edge -->
        <path d="M 148,88 C 158,80 178,82 178,96 C 178,110 156,112 146,95 Z" 
              fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" />
        <!-- Inner white accent -->
        <path d="M 152,90 C 162,86 170,88 170,96 C 168,103 158,102 152,94 Z" 
              fill="#ffffff" opacity="0.9" stroke="#111111" stroke-width="1.8" />
        <path d="M 174,88 C 178,92 178,98 174,102" 
              fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Nemo's Big Disney-Style Expressive Eye -->
      <g id="nemo-eye" class="nemo-eye-group">
        <!-- Eye Socket / White Sclera -->
        <ellipse cx="198" cy="72" rx="14" ry="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" />
        <!-- Iris (Warm amber/golden brown) -->
        <ellipse cx="199" cy="72" rx="9.5" ry="10" fill="url(#nemoEyeGrad)" />
        <!-- Pupil (Deep black) -->
        <ellipse cx="200" cy="72" rx="6.5" ry="7" fill="#111111" />
        <!-- Big Specular Light Highlight (Life & charm) -->
        <circle cx="197" cy="69" r="3" fill="#ffffff" />
        <!-- Secondary Tiny Sparkle -->
        <circle cx="203" cy="74" r="1.2" fill="#ffffff" />

        <!-- Eyelid for Sleeping / Winking Animation -->
        <path id="eyelid" class="eyelid-anim"
              d="M 184,72 C 184,57 212,57 212,72 C 212,65 184,65 184,72 Z" 
              fill="#ff5722" stroke="#1a1a1a" stroke-width="2" opacity="0" />
      </g>
    </g>
  </g>
</svg>
