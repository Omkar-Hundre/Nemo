<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEMO Floating Avatar & Process Controller</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="state-sleeping">

  <!-- ====================================================================
       1. FLOATING AVATAR VIEW (Default compact state)
       ==================================================================== -->
  <div id="avatar-container" class="pywebview-drag-region" onclick="handleAvatarClick(event)">
    <!-- Animated Finding Nemo SVG Fish -->
    <div class="fish-box" id="fish-box">
      <!-- Inlined SVG Clownfish with dynamic fin and eye layers -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" class="nemo-clownfish-svg">
        <defs>
          <radialGradient id="nemoBodyGrad" cx="45%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ff9100" />
            <stop offset="60%" stop-color="#ff5722" />
            <stop offset="100%" stop-color="#d84315" />
          </radialGradient>
          <linearGradient id="nemoFinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffa726" stop-opacity="0.9" />
            <stop offset="70%" stop-color="#f4511e" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#1a1a1a" />
          </linearGradient>
          <linearGradient id="nemoBellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <radialGradient id="nemoEyeGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffb74d" />
            <stop offset="50%" stop-color="#e65100" />
            <stop offset="100%" stop-color="#3e2723" />
          </radialGradient>
        </defs>

        <g id="nemo-container" class="nemo-character">
          <!-- Rising bubbles -->
          <g class="bubbles-group">
            <circle class="bubble bubble-1" cx="215" cy="85" r="4" fill="rgba(255,255,255,0.6)" />
            <circle class="bubble bubble-2" cx="230" cy="70" r="3" fill="rgba(255,255,255,0.5)" />
            <circle class="bubble bubble-3" cx="240" cy="95" r="5" fill="rgba(255,255,255,0.4)" />
          </g>

          <!-- Tail Fin (Animated wag) -->
          <g id="tail-group" class="tail-fin-anim">
            <path d="M 52,90 C 35,62 10,65 14,88 C 10,112 35,118 52,90 Z" 
                  fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M 38,76 C 28,78 26,98 38,103 C 44,97 44,83 38,76 Z" 
                  fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
            <path d="M 14,88 C 11,80 12,74 16,70 C 18,78 18,98 16,106 C 12,102 11,96 14,88 Z" fill="#111111" />
          </g>

          <!-- Dorsal Fin (Top) -->
          <path id="dorsal-fin" class="dorsal-fin-anim"
                d="M 115,48 C 125,25 155,22 175,44 C 158,40 135,42 115,48 Z" 
                fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" />
          <path d="M 125,25 C 145,21 165,28 175,44 C 168,36 148,30 125,25 Z" fill="#111111" />

          <!-- Ventral Fin (Bottom) -->
          <path id="ventral-fin" 
                d="M 125,128 C 118,146 140,154 152,132 C 142,131 133,130 125,128 Z" 
                fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2" />
          <path id="anal-fin"
                d="M 75,115 C 65,130 85,135 95,118 C 88,116 81,115 75,115 Z"
                fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2" />

          <!-- Main Fish Body -->
          <g id="main-body-group">
            <path id="body-silhouette" 
                  d="M 50,90 C 50,60 90,44 145,44 C 195,44 225,65 220,92 C 215,118 190,134 140,134 C 85,134 50,118 50,90 Z" 
                  fill="url(#nemoBodyGrad)" stroke="#1a1a1a" stroke-width="3" />

            <!-- Soft Belly lighting -->
            <path d="M 65,95 C 75,125 130,132 185,125 C 135,130 85,120 65,95 Z" fill="url(#nemoBellyGrad)" />

            <!-- Clownfish Band 1 (Tail) -->
            <g class="stripe-tail">
              <path d="M 68,70 C 65,85 65,95 68,110 C 74,112 76,70 68,70 Z" 
                    fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" />
            </g>

            <!-- Clownfish Band 2 (Center saddle) -->
            <g class="stripe-middle">
              <path d="M 125,46 C 110,65 112,110 125,132 C 135,132 144,128 138,105 C 145,95 146,80 138,65 C 142,52 135,46 125,46 Z" 
                    fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
            </g>

            <!-- Clownfish Band 3 (Head) -->
            <g class="stripe-head">
              <path d="M 178,48 C 168,68 168,112 180,127 C 190,123 194,115 186,95 C 187,80 192,65 188,52 C 184,48 180,48 178,48 Z" 
                    fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
            </g>

            <!-- Mouth -->
            <path id="nemo-mouth" d="M 215,95 C 218,99 221,100 224,98" 
                  fill="none" stroke="#261005" stroke-width="2.5" stroke-linecap="round" />

            <!-- Pectoral Fin: Nemo's Lucky Fin -->
            <g id="pectoral-fin-group" class="pectoral-fin-anim">
              <path d="M 148,88 C 158,80 178,82 178,96 C 178,110 156,112 146,95 Z" 
                    fill="url(#nemoFinGrad)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round" />
              <path d="M 152,90 C 162,86 170,88 170,96 C 168,103 158,102 152,94 Z" 
                    fill="#ffffff" opacity="0.9" stroke="#111111" stroke-width="1.8" />
              <path d="M 174,88 C 178,92 178,98 174,102" 
                    fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" />
            </g>

            <!-- Disney-Style Expressive Eye -->
            <g id="nemo-eye" class="nemo-eye-group">
              <ellipse cx="198" cy="72" rx="14" ry="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5" />
              <ellipse cx="199" cy="72" rx="9.5" ry="10" fill="url(#nemoEyeGrad)" />
              <ellipse cx="200" cy="72" rx="6.5" ry="7" fill="#111111" />
              <circle cx="197" cy="69" r="3" fill="#ffffff" />
              <circle cx="203" cy="74" r="1.2" fill="#ffffff" />
              <!-- Animated Eyelid for Sleeping State -->
              <path id="eyelid" class="eyelid-anim"
                    d="M 184,72 C 184,56 212,56 212,72 C 212,68 184,68 184,72 Z" 
                    fill="#ff5722" stroke="#1a1a1a" stroke-width="2" />
            </g>
          </g>
        </g>
      </svg>
    </div>

    <!-- Dynamic Status Pill -->
    <div id="status-pill" class="no-drag" onclick="handlePillClick(event)">
      <div class="pill-dot"></div>
      <span class="pill-text" id="pill-text">Nemo Resting</span>
    </div>
  </div>

  <!-- ====================================================================
       2. GLASSMORPHISM PROCESS MANAGER & TASK CONTROLLER GUI
       ==================================================================== -->
  <div id="manager-panel">
    <!-- Panel Header (Draggable) -->
    <div class="panel-header pywebview-drag-region">
      <div class="header-left">
        <svg class="mini-nemo-icon" viewBox="0 0 280 180">
          <ellipse cx="140" cy="90" rx="90" ry="45" fill="#ff6f00" />
          <path d="M 120,45 C 110,65 110,115 120,135 Z" stroke="#ffffff" stroke-width="12" />
        </svg>
        <span class="header-title">Nemo OS Controller</span>
        <span class="header-badge" id="ai-engine-badge">Whisper INT8 • Online</span>
      </div>
      <div class="header-actions no-drag">
        <button class="btn-icon" title="Open Native Terminal" onclick="triggerTerminal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </button>
        <button class="btn-icon" title="Collapse to Avatar" onclick="collapseToAvatar()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Subbar Statistics & Shortcuts -->
    <div class="panel-subbar">
      <div class="subbar-stats">
        <span>Active Tasks: <b id="stat-active">0</b></span>
        <span>Voice Mode: <b id="stat-voice" style="color: var(--nemo-bright)">Hands-Free</b></span>
        <span>Model: <b>Local Whisper</b></span>
      </div>
      <button class="btn-terminal no-drag" onclick="triggerTerminal()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        Launch wt.exe
      </button>
    </div>

    <!-- Active Tasks Table -->
    <div class="panel-table-wrap">
      <table class="task-table" id="task-table">
        <thead>
          <tr>
            <th style="width: 25%">Task ID</th>
            <th style="width: 45%">Objective / Action</th>
            <th style="width: 15%">Status</th>
            <th style="width: 15%; text-align: right">Action</th>
          </tr>
        </thead>
        <tbody id="task-tbody">
          <!-- Dynamically populated or empty state -->
        </tbody>
      </table>
      <div id="empty-state" class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 12h8"></path>
        </svg>
        <span>No running tasks. Say <b>"Nemo, ..."</b> or enter a command below.</span>
      </div>
    </div>

    <!-- Footer Command Input -->
    <div class="panel-footer no-drag">
      <input type="text" id="cmd-input" class="input-box" placeholder="Ask Nemo or give command (e.g. 'set timer 10s', 'take webcam snapshot')..." onkeydown="handleInputKey(event)" />
      <button class="btn-mic active" id="btn-mic" title="Toggle Voice Recognition" onclick="toggleMic()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button class="btn-send" onclick="sendInputCmd()">Execute</button>
    </div>
  </div>

  <!-- ====================================================================
       3. CLIENT JAVASCRIPT CONTROLLER
       ==================================================================== -->
  <script>
    let isExpanded = false;
    let activeTasks = [];
    let currentState = "sleeping";

    function updateState(newState, message) {
      currentState = newState;
      document.body.className = "state-" + newState;
      if (isExpanded) {
        document.body.classList.add("panel-visible");
      }
      if (message) {
        document.getElementById("pill-text").innerText = message;
      }
    }

    function expandManager() {
      if (isExpanded) return;
      isExpanded = true;
      document.body.classList.add("panel-visible");
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.expand_window();
      }
    }

    function collapseToAvatar() {
      isExpanded = false;
      document.body.classList.remove("panel-visible");
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.collapse_window();
      }
    }

    function handleAvatarClick(e) {
      if (e.target.closest("#status-pill")) return;
      expandManager();
    }

    function handlePillClick(e) {
      e.stopPropagation();
      expandManager();
    }

    function triggerTerminal() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.open_terminal();
      }
    }

    function toggleMic() {
      const micBtn = document.getElementById("btn-mic");
      const isActive = micBtn.classList.toggle("active");
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.toggle_voice(isActive);
      }
    }

    function handleInputKey(e) {
      if (e.key === "Enter") {
        sendInputCmd();
      }
    }

    function sendInputCmd() {
      const input = document.getElementById("cmd-input");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.execute_command(val);
      }
    }

    function cancelTask(taskId) {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.cancel_task(taskId);
      }
    }

    // Called from Python when task queue changes
    window.renderTaskList = function(tasks) {
      activeTasks = tasks || [];
      const tbody = document.getElementById("task-tbody");
      const emptyState = document.getElementById("empty-state");
      const activeCount = document.getElementById("stat-active");
      
      const runningCount = activeTasks.filter(t => t.status === "running").length;
      activeCount.innerText = runningCount;

      if (!activeTasks || activeTasks.length === 0) {
        tbody.innerHTML = "";
        emptyState.style.display = "flex";
        return;
      }

      emptyState.style.display = "none";
      tbody.innerHTML = activeTasks.map(t => `
        <tr>
          <td><span style="font-family: monospace; font-size: 11px; color: var(--text-dim)">#${t.id.slice(0, 8)}</span></td>
          <td><span class="task-title">${escapeHtml(t.name)}</span></td>
          <td><span class="status-badge ${t.status}">${t.status}</span></td>
          <td style="text-align: right">
            ${t.status === "running" ? `
              <button class="btn-icon btn-danger" title="Stop Task" onclick="cancelTask('${t.id}')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                </svg>
              </button>` : ''}
          </td>
        </tr>
      `).join("");
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial default test state
    window.addEventListener("DOMContentLoaded", () => {
      updateState("sleeping", "Nemo Resting");
    });
  </script>
</body>
</html>
