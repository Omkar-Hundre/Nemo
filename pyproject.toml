[project]
name = "nemo"
version = "0.1.0"
description = "AI-Native Developer Operating Environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.1.8",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
nemo = "nemo.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

