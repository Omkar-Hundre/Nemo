<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nemo Remote</title>
  <meta name="description" content="Nemo Mobile Remote Controller & Realtime Screen Stream">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nemo">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%230284c7'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%230284c7'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Suppress Netlify Injected Floating Badge */
    .netlify-badge,
    [data-netlify-badge],
    #netlify-badge,
    div[class*="netlify-badge"],
    a[href*="netlify.com"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
    }

    /* Light Theme (Default) */
    :root {
      --bg-page: #f1f5f9;
      --bg-app: #ffffff;
      --bg-header: rgba(255, 255, 255, 0.95);
      --bg-card: #ffffff;
      --bg-bubble-user: #0284c7;
      --text-bubble-user: #ffffff;
      --bg-bubble-ai: #ffffff;
      --text-bubble-ai: #0f172a;
      --border: #e2e8f0;
      --border-focus: #0284c7;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --accent-hover: #0369a1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      --bottom-bar-bg: rgba(255, 255, 255, 0.96);
      --input-bg: #f8fafc;
      --chip-bg: #ffffff;
      --chip-border: #cbd5e1;
    }

    /* Dark Theme */
    [data-theme="dark"] {
      --bg-page: #09090b;
      --bg-app: #111114;
      --bg-header: rgba(17, 17, 20, 0.94);
      --bg-card: #18181b;
      --bg-bubble-user: #0284c7;
      --text-bubble-user: #ffffff;
      --bg-bubble-ai: #18181b;
      --text-bubble-ai: #f4f4f5;
      --border: #27272a;
      --border-focus: #38bdf8;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --accent-hover: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.35);
      --bottom-bar-bg: rgba(17, 17, 20, 0.95);
      --input-bg: #18181b;
      --chip-bg: #18181b;
      --chip-border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* App Shell Container */
    #appContainer {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: var(--bg-app);
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      #appContainer {
        border-left: none;
        border-right: none;
      }
    }

    /* Standard Compact Topbar */
    header {
      flex-shrink: 0;
      height: 52px;
      padding: 0 12px;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar-badge {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: -0.5px;
      position: relative;
    }

    .status-badge-dot {
      position: absolute;
      bottom: 0px;
      right: 0px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      border: 1.5px solid #fff;
    }

    .status-badge-dot.pulse {
      animation: statusPulse 1.6s infinite;
    }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Center Mode Switcher Tabs */
    .mode-switcher {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px;
      gap: 2px;
    }

    .mode-tab {
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-tab.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .live-dot-mini {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      animation: statusPulse 1.2s infinite;
    }

    /* Right Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-header {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-header:hover {
      background: var(--input-bg);
      color: var(--text-main);
    }

    /* View Panels */
    .view-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .view-panel.active {
      display: flex;
    }

    /* Chat View */
    #chatPanel {
      height: calc(100% - 52px);
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 180px 12px; /* Generous bottom padding to clear elevated bar */
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .empty-chat {
      text-align: center;
      margin: auto 0;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .empty-chat-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: fadeInMsg 0.2s ease-out;
    }

    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* User Message Bubble */
    .msg-row.user {
      align-items: flex-end;
    }

    .msg-row.user .bubble {
      background: var(--bg-bubble-user);
      color: var(--text-bubble-user);
      border-radius: 18px 18px 4px 18px;
      padding: 9px 14px;
      max-width: 85%;
      font-size: 0.9rem;
      line-height: 1.4;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
    }

    .msg-row.user .msg-meta {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 3px;
      margin-right: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Assistant (Nemo) Message Bubble */
    .msg-row.assistant {
      align-items: flex-start;
    }

    .msg-row.assistant .bubble {
      background: var(--bg-bubble-ai);
      color: var(--text-bubble-ai);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      padding: 10px 14px;
      max-width: 90%;
      font-size: 0.88rem;
      line-height: 1.5;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
      position: relative;
    }

    .msg-row.assistant .msg-meta {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 3px;
      margin-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .bubble.pending {
      color: var(--warning);
      background: var(--input-bg);
      border-style: dashed;
    }

    .bubble.running {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bubble.failed {
      color: var(--danger);
      background: #fef2f2;
      border-color: #fecaca;
    }

    .copy-inline-btn {
      float: right;
      margin-left: 8px;
      margin-bottom: 4px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      cursor: pointer;
    }

    .copy-inline-btn:hover {
      color: var(--text-main);
      background: var(--border);
    }

    /* Snapshot preview inside chat bubble */
    .chat-snapshot-wrap {
      margin: 6px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      cursor: pointer;
      position: relative;
    }

    .chat-snapshot-img {
      width: 100%;
      height: auto;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }

    .chat-snapshot-tag {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 8px;
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    /* Pinned Bottom Area for Chat (Elevated above Netlify badge) */
    .bottom-pinned-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bottom-bar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      /* Lifted 48px to cleanly clear Netlify floating badge */
      padding: 8px 10px calc(env(safe-area-inset-bottom, 8px) + 48px) 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 40;
    }

    /* Compact horizontal chips */
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip-item {
      flex-shrink: 0;
      padding: 5px 11px;
      border-radius: 14px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .chip-item:hover, .chip-item:active {
      color: var(--text-main);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    /* Input pill bar */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 4px 6px 4px 12px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s;
      position: relative;
      z-index: 50;
    }

    .input-bar:focus-within {
      border-color: var(--border-focus);
    }

    .chat-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text-main);
      font-size: 0.92rem;
      padding: 6px 4px;
      font-family: inherit;
    }

    .chat-input::placeholder {
      color: var(--text-dim);
    }

    .btn-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-mic {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-mic:hover {
      color: var(--text-main);
    }

    .btn-mic.recording {
      color: #fff;
      background: var(--danger);
      animation: statusPulse 1s infinite;
    }

    .btn-send {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
    }

    .btn-send:hover {
      background: var(--accent-hover);
    }

    /* ====================================================
       PC LIVE SCREEN STREAM PANEL
       ==================================================== */
    #streamPanel {
      height: calc(100% - 52px);
      background: #000000;
      color: #fff;
      display: none;
      flex-direction: column;
      position: relative;
    }

    #streamPanel.active {
      display: flex;
    }

    /* Stream Top HUD bar */
    .stream-hud {
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.88);
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      z-index: 20;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-tag {
      background: #10b981;
      color: #fff;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
    }

    .live-tag.connecting {
      background: #f59e0b;
    }

    .live-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: statusPulse 1.2s infinite;
    }

    .hud-stats {
      color: #9ca3af;
      font-size: 0.7rem;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stream-source-select {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: inherit;
      padding: 3px 6px;
      outline: none;
    }

    /* Stream Viewport Container */
    .stream-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050507;
      overflow: hidden;
      padding-bottom: 80px; /* Room for command bar */
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    #streamCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* Offline / Waiting Overlay */
    .stream-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      color: #9ca3af;
    }

    .stream-placeholder h4 {
      color: #f3f4f6;
      font-size: 1rem;
      font-weight: 600;
    }

    .stream-placeholder p {
      font-size: 0.8rem;
      max-width: 320px;
      line-height: 1.45;
      color: #9ca3af;
    }

    .stream-action-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .btn-stream-action {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-stream-secondary {
      background: #374151;
      color: #e5e7eb;
    }

    /* Stream Floating Quick Command Bar */
    .stream-command-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid #1e293b;
      /* Lifted 48px to clear Netlify badge */
      padding: 8px 10px calc(env(safe-area-inset-bottom, 8px) + 48px) 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }

    .stream-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stream-tool-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* Settings Modal */
    .settings-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 9000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .settings-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .settings-input {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

  <div id="appContainer">

    <!-- Compact Standard Header -->
    <header>
      <div class="brand-section">
        <div class="avatar-badge">
          N
          <span class="status-badge-dot pulse" id="headerStatusDot"></span>
        </div>
        <div>
          <div class="brand-title">Nemo</div>
          <div class="brand-sub" id="headerSubText">online</div>
        </div>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="mode-switcher">
        <button class="mode-tab active" id="tabChat" onclick="switchView('chat')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <button class="btn-circle btn-send" onclick="submitStreamQuickCommand()">

  </div>

  <!-- Settings Modal -->
  <div class="settings-modal" id="settingsModal" onclick="if(event.target === this) closeSettings()">
    <div class="settings-card">
      <div class="settings-title">
        <span>Connection Settings</span>
        <button class="btn-header" onclick="closeSettings()">✕</button>
      </div>
      <div class="settings-field">
        <label class="settings-label">PC LAN IP or WebSocket URL</label>
        <input type="text" class="settings-input" id="cfgWsUrl" placeholder="192.168.1.3 or ws://192.168.1.3:8765/stream">
        <span style="font-size: 0.7rem; color: var(--text-dim); margin-top: 2px;" id="cfgDetectedIpNote">Auto-detected from laptop.</span>
      </div>
      <div class="settings-field">
        <label class="settings-label">WebRTC Session ID</label>
        <input type="text" class="settings-input" id="cfgSessionId" value="nemo-main">

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Screen Preview">
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://jdrcwujxrtxcyahigbmi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkcmN3dWp4cnR4Y3lhaGlnYm1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjIxODAsImV4cCI6MjEwMDgzODE4MH0.siuTaRqaXE0zeZtGj-C3CcVfqa_kpSqcVYVaed6Ttss";
    const HEADERS = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    // State
    let currentTheme = localStorage.getItem('nemo_theme') || 'light';
    let currentView = 'chat';
    // Default to WebSocket (LAN) for immediate zero-config viewing with nemo voice
    let currentStreamSource = localStorage.getItem('nemo_stream_source') || 'websocket';
    let detectedLanIp = '192.168.1.3';
    let wsUrl = localStorage.getItem('nemo_ws_url') || `ws://${detectedLanIp}:8765/stream`;
    let sessionId = localStorage.getItem('nemo_session_id') || 'nemo-main';

    // Global task result storage for safe copy buttons (no inline string/quote escaping issues)
    window.__taskResults = {};

    let peerConnection = null;
    let webSocket = null;
    let cloudStreamTimer = null;
    let signalingTimer = null;
    let lastSignalingTs = new Date(Date.now() - 15000).toISOString();
    let frameCount = 0;
    let fpsCalcInterval = null;

    // Apply Theme
    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('nemo_theme', theme);
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.innerText = theme === 'dark' ? '🌙' : '☀️';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = theme === 'dark' ? '#111114' : '#ffffff';
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    // Switch View (Chat vs Stream)
    function switchView(view) {
      currentView = view;
      document.getElementById('tabChat').classList.toggle('active', view === 'chat');
      document.getElementById('tabStream').classList.toggle('active', view === 'stream');

      document.getElementById('chatPanel').classList.toggle('active', view === 'chat');
      document.getElementById('streamPanel').classList.toggle('active', view === 'stream');

      if (view === 'stream') {
        startStream(currentStreamSource);
      } else {
        stopStream();
      }
    }

    // =========================================================
    // PC STATUS & LAN IP AUTO-DISCOVERY
    // =========================================================

    async function fetchPcStatus() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_stream_signaling?type=eq.pc_status&order=created_at.desc&limit=1`, { headers: HEADERS });
        if (!res.ok) return;
        const rows = await res.json();
        if (rows && rows.length > 0) {
          const payload = JSON.parse(rows[0].payload);
          if (payload && payload.local_ip) {
            detectedLanIp = payload.local_ip;
            const customSet = localStorage.getItem('nemo_user_custom_ip');
            if (!customSet) {
              wsUrl = payload.ws_url || `ws://${detectedLanIp}:8765/stream`;
              document.getElementById('cfgWsUrl').placeholder = wsUrl;
            }
            document.getElementById('headerSubText').innerText = `PC Online (${detectedLanIp})`;
            document.getElementById('cfgDetectedIpNote').innerText = `Auto-discovered laptop IP: ${detectedLanIp}`;
          }
        }
      } catch (err) {}
    }

    // =========================================================
    // REALTIME STREAMING ENGINES
    // =========================================================

    function changeStreamSource(source) {
      currentStreamSource = source;
      localStorage.setItem('nemo_stream_source', source);
      stopStream();
      startStream(source);
    }

    function startStream(source) {
      stopStream();
      startFpsCounter();

      document.getElementById('streamSourceSelect').value = source;
      document.getElementById('streamPlaceholder').style.display = 'flex';
      document.getElementById('remoteVideo').style.display = 'none';
      document.getElementById('streamCanvas').style.display = 'none';
      document.getElementById('hudLiveTag').classList.add('connecting');

      if (source === 'websocket') {
        startWebSocketStream();
      } else if (source === 'cloud') {
        startCloudStream();
      } else if (source === 'webrtc') {
        startWebRtcStream();
      }
    }

    function stopStream() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (webSocket) {
        webSocket.close();
        webSocket = null;
      }
      if (cloudStreamTimer) {
        clearInterval(cloudStreamTimer);
        cloudStreamTimer = null;
      }
      if (signalingTimer) {
        clearInterval(signalingTimer);
        signalingTimer = null;
      }
      if (fpsCalcInterval) {
        clearInterval(fpsCalcInterval);
        fpsCalcInterval = null;
      }
      document.getElementById('hudStats').innerText = "Disconnected";
    }

    function startFpsCounter() {
      frameCount = 0;
      if (fpsCalcInterval) clearInterval(fpsCalcInterval);
      fpsCalcInterval = setInterval(() => {
        const fps = frameCount;
        frameCount = 0;
        if (fps > 0) {
          document.getElementById('hudLiveTag').classList.remove('connecting');
          document.getElementById('hudStats').innerText = `720p • ${fps} FPS`;
        }
      }, 1000);
    }

    // Engine 1: Local High-Speed WebSocket Stream (Default for nemo voice)
    function startWebSocketStream() {
      document.getElementById('streamNoticeTitle').innerText = "Connecting to WebSocket...";
      document.getElementById('streamNoticeBody').innerText = `Connecting to ${wsUrl}. (Ensure nemo voice is running on PC)`;

      let normalizedUrl = wsUrl;
      if (!normalizedUrl.startsWith('ws://') && !normalizedUrl.startsWith('wss://')) {
        normalizedUrl = `ws://${normalizedUrl}:8765/stream`;
      }

      try {
        webSocket = new WebSocket(normalizedUrl);
        const canvas = document.getElementById('streamCanvas');
        const ctx = canvas.getContext('2d');

        webSocket.onopen = () => {
          document.getElementById('streamPlaceholder').style.display = 'none';
          canvas.style.display = 'block';
          document.getElementById('hudLiveTag').classList.remove('connecting');
          document.getElementById('hudStats').innerText = "WebSocket LIVE (720p)";
        };

        webSocket.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'frame' && data.data) {
              frameCount++;
              const img = new Image();
              img.onload = () => {
                if (canvas.width !== img.width) {
                  canvas.width = img.width;
                  canvas.height = img.height;
                }
                ctx.drawImage(img, 0, 0);
              };
              img.src = "data:image/jpeg;base64," + data.data;
            }
          } catch (err) {}
        };

        webSocket.onerror = () => {
          document.getElementById('streamNoticeTitle').innerText = "WebSocket Offline";
          document.getElementById('streamNoticeBody').innerText = `Could not connect to ${normalizedUrl}. If on cellular data, switch dropdown to 'Cloud (Supabase)'.`;
          // Smart fallback: If on cellular data and cannot connect LAN, auto-switch to cloud stream
          setTimeout(() => {
            if (!webSocket || webSocket.readyState !== WebSocket.OPEN) {
              changeStreamSource('cloud');
            }
          }, 3500);
        };
      } catch (e) {
        document.getElementById('streamNoticeTitle').innerText = "WebSocket Error";
      }
    }

    // Engine 2: Cloud Live Snapshot Stream (Works on Cellular / Outside Network)
    function startCloudStream() {
      document.getElementById('streamNoticeTitle').innerText = "Connecting to Cloud Stream...";
      document.getElementById('streamNoticeBody').innerText = "Streaming real-time 720p screen captures via Supabase.";
      const canvas = document.getElementById('streamCanvas');
      const ctx = canvas.getContext('2d');

      const fetchCloudFrame = async () => {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_remote_tasks?prompt=ilike.*snapshot*&status=eq.completed&order=updated_at.desc&limit=1`, { headers: HEADERS });
          if (!res.ok) return;
          const rows = await res.json();
          if (rows.length && rows[0].result) {
            const match = rows[0].result.match(/data:image\/[a-zA-Z]+;base64,([A-Za-z0-9+/=]+)/);
            if (match && match[0]) {
              frameCount++;
              document.getElementById('streamPlaceholder').style.display = 'none';
              canvas.style.display = 'block';
              document.getElementById('hudLiveTag').classList.remove('connecting');
              const img = new Image();
              img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
              };
              img.src = match[0];
            }
          }
        } catch (e) {}
      };

      fetchCloudFrame();
      cloudStreamTimer = setInterval(fetchCloudFrame, 1500);
    }

    // Engine 3: Google Meet WebRTC Technology
    async function startWebRtcStream() {
      document.getElementById('streamNoticeTitle').innerText = "Connecting via WebRTC (Google Meet Tech)...";
      document.getElementById('streamNoticeBody').innerText = "Waiting for PC Broadcaster. Click 'Open WebRTC on PC' if not yet open.";

      const rtcConfig = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" }
        ]
      };

      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        const video = document.getElementById('remoteVideo');
        video.srcObject = event.streams[0];
        video.style.display = 'block';
        document.getElementById('streamPlaceholder').style.display = 'none';
        document.getElementById('hudLiveTag').classList.remove('connecting');
        document.getElementById('hudStats').innerText = "720p 30fps • Connected";
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal('candidate', event.candidate);
        }
      };

      await sendSignal('phone_join', { timestamp: Date.now() });
      signalingTimer = setInterval(pollWebRtcSignals, 1000);
    }

    async function sendSignal(type, payload) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/nemo_stream_signaling`, {
          method: 'POST',
          headers: HEADERS,
          body: JSON.stringify({
            session_id: sessionId,
            sender: 'phone',
            type: type,
            payload: JSON.stringify(payload)
          })
        });
      } catch (err) {}
    }

    async function pollWebRtcSignals() {
      try {
        const url = `${SUPABASE_URL}/rest/v1/nemo_stream_signaling?session_id=eq.${sessionId}&sender=eq.pc&created_at=gt.${encodeURIComponent(lastSignalingTs)}&order=created_at.asc`;
        const res = await fetch(url, { headers: HEADERS });
        if (!res.ok) return;
        const msgs = await res.json();

        for (const msg of msgs) {
          lastSignalingTs = msg.created_at;
          const payload = JSON.parse(msg.payload);

          if (msg.type === 'offer' && peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await sendSignal('answer', answer);
          } else if (msg.type === 'candidate' && peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(payload));
          }
        }
      } catch (err) {}
    }

    function retryStreamConnection() {
      startStream(currentStreamSource);
    }

    function requestOpenBroadcasterOnPc() {
      sendPrompt("open presenter");
      alert("Sent command to laptop to open WebRTC screen broadcaster in browser!");
    }

    function toggleStreamFullscreen() {
      const elem = document.getElementById('viewportWrap');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function captureInstantSnapshot() {
      sendPrompt("send me a snapshot of the screen");
      alert("Snapshot requested. Check Chat tab in ~1 second!");
    }

    function submitStreamQuickCommand() {
      const input = document.getElementById('streamQuickInput');
      if (input.value.trim()) {
        sendPrompt(input.value.trim());
        input.value = '';
      }
    }

    // =========================================================
    // CHAT ENGINE & SUPABASE SYNC (Robust, No Apostrophe Breaks)
    // =========================================================

    async function sendPrompt(text) {
      if (!text || !text.trim()) return;
      const prompt = text.trim();
      document.getElementById('promptInput').value = '';

      updateStatusUI('working', 'sending...');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_remote_tasks`, {
          method: 'POST',
          headers: HEADERS,
          body: JSON.stringify({
            prompt: prompt,
            status: 'pending',
            device: /iPhone|iPad|Android/i.test(navigator.userAgent) ? 'phone' : 'mobile'
          })
        });
        if (res.ok) {
          loadTasks();
        }
      } catch (err) {
        console.error("Submit error:", err);
      }
    }

    function submitPrompt() {
      const val = document.getElementById('promptInput').value;
      sendPrompt(val);
    }

    async function loadTasks() {
      try {
        // Fetch 50 most recent tasks in descending order, then reverse to chronological order
        const res = await fetch(`${SUPABASE_URL}/rest/v1/nemo_remote_tasks?order=created_at.desc&limit=50`, {
          headers: HEADERS
        });
        if (!res.ok) return;
        const tasks = await res.json();
        tasks.reverse(); // Now in chronological order: oldest to newest
        renderChat(tasks);

        const hasRunning = tasks.some(t => t.status === 'running' || t.status === 'pending');
        if (hasRunning) {
          updateStatusUI('working', 'working on pc...');
        } else {
          updateStatusUI('ready', 'online');
        }
      } catch (err) {
        console.error("loadTasks error:", err);
      }
    }

    function renderChat(tasks) {
      const container = document.getElementById('chatFeed');
      if (!tasks || tasks.length === 0) {
        document.getElementById('emptyChatNotice').style.display = 'block';
        return;
      }
      document.getElementById('emptyChatNotice').style.display = 'none';

      container.innerHTML = tasks.map(t => {
        // Store result safely in global map to prevent any quote/apostrophe JS syntax errors
        window.__taskResults[t.id] = t.result || '';

        const timeStr = new Date(t.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // User Prompt Bubble (Aligned Right)
        const userRow = `
          <div class="msg-row user">
            <div class="bubble">${escapeHtml(t.prompt)}</div>
            <div class="msg-meta">${timeStr}</div>
          </div>
        `;

        // Assistant Result Bubble (Aligned Left)
        let aiBubbleContent = '';
        if (t.status === 'completed' && t.result) {
          let textPortion = t.result;
          let imageHtml = '';

          const dataUriIdx = t.result.indexOf('data:image/');
          if (dataUriIdx !== -1) {
            let endIdx = t.result.indexOf(')', dataUriIdx);
            if (endIdx === -1) endIdx = t.result.length;
            const rawUri = t.result.substring(dataUriIdx, endIdx);
            const cleanDataUri = rawUri.replace(/[\s"'\\]+/g, '');

            textPortion = t.result.replace(/!\[[\s\S]*?\]\([\s\S]*?\)/g, '')
                                  .replace(rawUri, '')
                                  .trim();

            imageHtml = `
              <div class="chat-snapshot-wrap" onclick="openLightbox('${cleanDataUri}')">
                <img src="${cleanDataUri}" class="chat-snapshot-img" alt="PC Screen" loading="lazy">
                <div class="chat-snapshot-tag">Tap to expand • PC Screen</div>
              </div>
            `;
          }

          const rawEscaped = escapeHtml(textPortion);
          aiBubbleContent = `
            <div class="bubble">
              <button class="copy-inline-btn" onclick="copyResultSafe(this, '${t.id}')">copy</button>
              ${imageHtml}
              ${rawEscaped ? `<div>${rawEscaped}</div>` : ''}
            </div>
            <div class="msg-meta">
              <span>Nemo</span> • <span>${timeStr}</span>
            </div>
          `;
        } else if (t.status === 'running') {
          aiBubbleContent = `
            <div class="bubble running">
              <span class="live-dot-mini" style="background: var(--accent);"></span>
              Executing on Windows PC...
            </div>
          `;
        } else if (t.status === 'pending') {
          aiBubbleContent = `
            <div class="bubble pending">Queued — waiting for PC listener...</div>
          `;
        } else if (t.error) {
          aiBubbleContent = `
            <div class="bubble failed">${escapeHtml(t.error)}</div>
          `;
        }

        const aiRow = aiBubbleContent ? `
          <div class="msg-row assistant">
            ${aiBubbleContent}
          </div>
        ` : '';

        return userRow + aiRow;
      }).join('');

      // Auto scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    function updateStatusUI(state, label) {
      const dot = document.getElementById('headerStatusDot');
      const text = document.getElementById('headerSubText');
      if (text) text.innerText = label;
      if (dot) {
        dot.style.background = state === 'working' ? 'var(--accent)' : 'var(--success)';
      }
    }

    // Safe clipboard copy by task ID
    function copyResultSafe(btn, taskId) {
      const text = window.__taskResults[taskId] || '';
      navigator.clipboard.writeText(text);
      btn.innerText = 'copied!';
      setTimeout(() => btn.innerText = 'copy', 1500);
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function openSettings() {
      document.getElementById('cfgWsUrl').value = wsUrl;
      document.getElementById('cfgSessionId').value = sessionId;
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const userVal = document.getElementById('cfgWsUrl').value.trim();
      if (userVal) {
        wsUrl = userVal;
        localStorage.setItem('nemo_ws_url', wsUrl);
        localStorage.setItem('nemo_user_custom_ip', '1');
      }
      sessionId = document.getElementById('cfgSessionId').value.trim() || sessionId;
      localStorage.setItem('nemo_session_id', sessionId);
      closeSettings();
      if (currentView === 'stream') {
        startStream(currentStreamSource);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Voice Dictation
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
      };
      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        document.getElementById('promptInput').value = transcript;
      };
      recognition.onerror = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
      recognition.onend = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
    }

    function toggleMic() {
      if (!recognition) {
        alert("Speech recognition not supported on this browser.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        document.getElementById('promptInput').value = '';
        recognition.start();
      }
    }

    // Initialize
    applyTheme(currentTheme);
    fetchPcStatus();
    loadTasks();
    setInterval(loadTasks, 2000);
    setInterval(fetchPcStatus, 15000);
  </script>
</body>
</html>
