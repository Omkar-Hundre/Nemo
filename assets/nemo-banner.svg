<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#111a2e" />
      <stop offset="50%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff3b00" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d4f7ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .fish-anim {
        animation: swim 4s ease-in-out infinite alternate;
        transform-origin: 120px 180px;
      }
      .fin-anim {
        animation: finWave 1.2s ease-in-out infinite alternate;
        transform-origin: 135px 190px;
      }
      .bubble-1 { animation: rise 3s infinite linear; }
      .bubble-2 { animation: rise 4.2s infinite linear 1s; }
      .pulse-ring { animation: pulseOut 2.5s infinite ease-out; }
      .pulse-dot { animation: blink 2s infinite ease-in-out; }

      @keyframes swim {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
        100% { transform: translateY(6px) rotate(-1.5deg); }
      }
      @keyframes finWave {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(18deg); }
      }
      @keyframes rise {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
      }
      @keyframes pulseOut {
        0% { r: 12; opacity: 0.8; }
        100% { r: 38; opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .tech-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" rx="16" fill="url(#bgGrad)" stroke="#1a263d" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="60" x2="960" y2="60" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="300" x2="960" y2="300" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="640" y1="0" x2="640" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
  </g>

  <!-- Glowing Accent Light Orbs -->
  <circle cx="120" cy="180" r="100" fill="#ff7a00" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="120" r="140" fill="#00f0ff" opacity="0.10" filter="url(#glow)" />

  <!-- Floating Clownfish Mascot (Left Side) -->
  <g class="fish-anim">
    <!-- Sound Waves / Sonar Rings -->
    <circle cx="120" cy="180" class="pulse-ring" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="120" cy="180" class="pulse-ring" style="animation-delay: 1.2s;" fill="none" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Tail Fin -->
    <path d="M 68 180 L 40 148 Q 50 180 40 212 Z" fill="url(#orangeGlow)" stroke="#381007" stroke-width="2" />
    <path d="M 45 160 Q 55 180 45 200" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Dorsal Fin -->
    <path d="M 100 145 Q 120 120 145 142 Z" fill="url(#orangeGlow)" stroke="#381007" stroke-width="2" />
    
    <!-- Body -->
    <ellipse cx="120" cy="180" rx="52" ry="34" fill="url(#orangeGlow)" stroke="#381007" stroke-width="2.5" />

    <!-- White Clownfish Stripes with Dark Contours -->
    <!-- Middle Stripe -->
    <path d="M 108 147 Q 115 180 108 213 Q 118 212 120 180 Q 118 148 108 147 Z" fill="#ffffff" stroke="#2a1205" stroke-width="1.5" />
    <!-- Front Stripe -->
    <path d="M 140 152 Q 146 180 140 208 Q 148 206 149 180 Q 148 154 140 152 Z" fill="#ffffff" stroke="#2a1205" stroke-width="1.5" />
    <!-- Rear Stripe -->
    <path d="M 78 165 Q 82 180 78 195 Q 84 194 85 180 Q 84 166 78 165 Z" fill="#ffffff" stroke="#2a1205" stroke-width="1.5" />

    <!-- Pectoral Fin -->
    <g class="fin-anim">
      <ellipse cx="130" cy="192" rx="14" ry="8" fill="#ff8c26" stroke="#2a1205" stroke-width="1.5" transform="rotate(-15 130 192)" />
      <path d="M 124 192 Q 134 192 140 190" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Eye -->
    <circle cx="152" cy="172" r="6.5" fill="#ffffff" stroke="#2a1205" stroke-width="1.5" />
    <circle cx="154" cy="172" r="3.5" fill="#111111" />
    <circle cx="155" cy="170.5" r="1.2" fill="#ffffff" />

    <!-- Floating Air / Audio Bubbles -->
    <circle cx="178" cy="160" r="3" fill="#00f0ff" opacity="0.6" class="bubble-1" />
    <circle cx="188" cy="150" r="4.5" fill="#00f0ff" opacity="0.5" class="bubble-2" />
  </g>

  <!-- Center Content -->
  <g transform="translate(260, 50)">
    <!-- Active Status Pill -->
    <rect x="0" y="20" width="280" height="28" rx="14" fill="#0b1726" stroke="#00f0ff" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="34" r="4.5" fill="#10b981" class="pulse-dot" />
    <text x="30" y="38" fill="#00f0ff" class="tech-badge" font-weight="700">● NEMO 2.0 DEV RUNTIME ACTIVE</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      NEMO
    </text>

    <!-- Subtitle -->
    <text x="0" y="136" fill="#f0f4f8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">
      Autonomous Windows Developer Operating Runtime
    </text>
    <text x="0" y="162" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Voice-First • Local Whisper INT8 • Snip &amp; Sketch Vision • Ground-Truth Verification
    </text>

    <!-- Command Preview Box -->
    <rect x="0" y="190" width="620" height="42" rx="8" fill="#06080d" stroke="#1f2d45" stroke-width="1" />
    <text x="16" y="216" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700">PS D:\&gt;</text>
    <text x="80" y="216" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">nemo "snip error popup and search fix" / nemo voice</text>

    <!-- Badges Row -->
    <g transform="translate(0, 252)">
      <!-- Badge 1: Local Whisper -->
      <rect x="0" y="0" width="140" height="26" rx="6" fill="#101828" stroke="#1f2d45" stroke-width="1" />
      <text x="10" y="17" fill="#94a3b8" class="tech-badge">🎙️ Local Whisper INT8</text>

      <!-- Badge 2: Win32 & UIA -->
      <rect x="150" y="0" width="145" height="26" rx="6" fill="#101828" stroke="#1f2d45" stroke-width="1" />
      <text x="160" y="17" fill="#94a3b8" class="tech-badge">💻 Win32 + UIA Native</text>

      <!-- Badge 3: 42 Tests Passed -->
      <rect x="305" y="0" width="130" height="26" rx="6" fill="#101828" stroke="#10b981" stroke-width="1" />
      <text x="315" y="17" fill="#10b981" class="tech-badge">✓ 42/42 Tests Green</text>

      <!-- Badge 4: Zero Hallucination -->
      <rect x="445" y="0" width="165" height="26" rx="6" fill="#101828" stroke="#1f2d45" stroke-width="1" />
      <text x="455" y="17" fill="#00f0ff" class="tech-badge">🛡️ Verification Gate Active</text>
    </g>
  </g>
</svg>