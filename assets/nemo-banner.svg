<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #090b10; }
      .border { stroke: #1e2638; stroke-width: 1; fill: none; }
      .grid-line { stroke: #131a29; stroke-width: 1; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 32px; font-weight: 700; fill: #ffffff; letter-spacing: -0.8px; }
      .tag { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-size: 14px; fill: #94a3b8; }
      .mono-box { fill: #0e131f; stroke: #1e293b; stroke-width: 1; }
      .step-text { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #e2e8f0; }
      .step-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow-head { fill: #334155; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="220" rx="8" class="bg" />
  <rect width="960" height="220" rx="8" class="border" />

  <!-- Subtle Blueprint Grid -->
  <line x1="40" y1="40" x2="920" y2="40" class="grid-line" />
  <line x1="40" y1="120" x2="920" y2="120" class="grid-line" />
  <line x1="40" y1="180" x2="920" y2="180" class="grid-line" />

  <!-- Header Branding -->
  <g transform="translate(48, 48)">
    <rect x="0" y="-18" width="56" height="22" rx="4" fill="#0369a1" opacity="0.2" />
    <text x="7" y="-3" class="tag">RUNTIME</text>
    <text x="68" y="-3" class="title">nemo</text>
    <text x="160" y="-3" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">v0.1.0 • Windows 11 Native</text>
    <text x="0" y="24" class="subtitle">Autonomous developer runtime for database introspection, API testing, AST codebase analysis, and safe deployment.</text>
  </g>

  <!-- Architectural Workflow Pipeline -->
  <g transform="translate(48, 126)">
    <!-- Stage 1: Input -->
    <rect x="0" y="0" width="180" height="48" rx="6" class="mono-box" />
    <text x="14" y="20" class="step-text">nemo &lt;task&gt;</text>
    <text x="14" y="36" class="step-sub">CLI or voice intent</text>

    <!-- Arrow 1 -->
    <line x1="188" y1="24" x2="216" y2="24" class="arrow" />
    <polygon points="216,21 222,24 216,27" class="arrow-head" />

    <!-- Stage 2: AST & Schema Parser -->
    <rect x="228" y="0" width="200" height="48" rx="6" class="mono-box" />
    <text x="14" y="20" transform="translate(228, 0)" class="step-text">AST &amp; Schema Parser</text>
    <text x="14" y="36" transform="translate(228, 0)" class="step-sub">Static trees &amp; DB tables</text>

    <!-- Arrow 2 -->
    <line x1="436" y1="24" x2="464" y2="24" class="arrow" />
    <polygon points="464,21 470,24 464,27" class="arrow-head" />

    <!-- Stage 3: Verification Gate -->
    <rect x="476" y="0" width="190" height="48" rx="6" class="mono-box" />
    <text x="14" y="20" transform="translate(476, 0)" class="step-text">Verification Gate</text>
    <text x="14" y="36" transform="translate(476, 0)" class="step-sub">Safety checks &amp; tests</text>

    <!-- Arrow 3 -->
    <line x1="674" y1="24" x2="702" y2="24" class="arrow" />
    <polygon points="702,21 708,24 702,27" class="arrow-head" />

    <!-- Stage 4: Deterministic Result -->
    <rect x="714" y="0" width="150" height="48" rx="6" class="mono-box" stroke="#0284c7" />
    <text x="14" y="20" transform="translate(714, 0)" class="step-text" fill="#38bdf8">Verified Output</text>
    <text x="14" y="36" transform="translate(714, 0)" class="step-sub">Safe local execution</text>
  </g>
</svg>
