<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <radialGradient id="termBg" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>
    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" rx="14" fill="#030712" stroke="#1f2937" stroke-width="1.5" />

  <!-- Terminal Window (Left 620px) -->
  <g transform="translate(24, 24)">
    <rect width="600" height="352" rx="10" fill="url(#termBg)" stroke="#374151" stroke-width="1" />
    
    <!-- Titlebar -->
    <rect width="600" height="36" rx="10" fill="#1f2937" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="300" y="22" fill="#9ca3af" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" text-anchor="middle">Windows PowerShell — nemo "draw a red box around submit button in app.png"</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 56)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" line-height="1.6">
      <text x="0" y="16" fill="#00f0ff" font-weight="700">PS D:\Nemo&gt;</text>
      <text x="96" y="16" fill="#f9fafb">nemo "draw a red box around the submit button in app.png"</text>
      
      <text x="0" y="44" fill="#3b82f6" font-weight="700">Starting task:</text>
      <text x="120" y="44" fill="#9ca3af">draw a red box around the submit button in app.png</text>

      <text x="0" y="74" fill="#e5e7eb" font-weight="700">Execution Steps:</text>
      <text x="0" y="98" fill="#10b981"> ✓</text>
      <text x="18" y="98" fill="#00f0ff" font-weight="700">desktop_integration</text>
      <text x="160" y="98" fill="#6b7280">{'action': 'annotate_image', 'shape': 'box', 'color': 'red'}</text>
      <text x="24" y="116" fill="#4b5563" font-size="10.5">• Located button at (200, 160, 400, 220), rendered rounded rectangle + badge.</text>

      <text x="0" y="146" fill="#e5e7eb" font-weight="700">Verification Gate:</text>
      <text x="0" y="166" fill="#10b981"> ✓  Verified: app_annotated.png saved (240 KB), CF_DIB copied to clipboard.</text>
      <text x="0" y="184" fill="#10b981"> ✓  Opened in Windows Snipping Tool (Snip &amp; Sketch).</text>

      <!-- Final Outcome Box -->
      <rect x="0" y="206" width="560" height="64" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
      <text x="14" y="228" fill="#34d399" font-weight="700">[Final Outcome]</text>
      <text x="14" y="250" fill="#f3f4f6">Red bounding box drawn properly around the submit button in app.png and opened</text>
      <text x="14" y="264" fill="#f3f4f6">in Snip &amp; Sketch ready for markup.</text>
    </g>
  </g>

  <!-- Right Side: Floating Nemo Taskbar Pill & Mascot (300px) -->
  <g transform="translate(650, 40)">
    <!-- Card Frame -->
    <rect width="280" height="320" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <text x="140" y="32" text-anchor="middle" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">
      NEMO OS FLOATING PILL
    </text>
    <text x="140" y="48" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">
      Always-on-top • Windows Taskbar
    </text>

    <!-- Floating Nemo Clownfish Graphic -->
    <g transform="translate(140, 120)">
      <circle cx="0" cy="0" r="48" fill="#ff7a00" fill-opacity="0.12" filter="url(#softGlow2)" />
      <!-- Fish -->
      <ellipse cx="0" cy="0" rx="36" ry="22" fill="#ff6b35" stroke="#2a1205" stroke-width="2" />
      <path d="M 22 0 L 40 -15 L 40 15 Z" fill="#ff6b35" stroke="#2a1205" stroke-width="2" />
      <path d="M -8 -22 Q -4 0 -8 22 Q 0 20 2 0 Q 0 -20 -8 -22 Z" fill="#ffffff" stroke="#2a1205" stroke-width="1.5" />
      <path d="M 12 -18 Q 15 0 12 18 Q 18 16 19 0 Q 18 -16 12 -18 Z" fill="#ffffff" stroke="#2a1205" stroke-width="1.5" />
      <circle cx="-20" cy="-6" r="4.5" fill="#ffffff" stroke="#2a1205" stroke-width="1" />
      <circle cx="-19" cy="-6" r="2.5" fill="#111111" />
    </g>

    <!-- Taskbar Floating Pill Component -->
    <g transform="translate(20, 200)">
      <rect width="240" height="42" rx="21" fill="#030712" stroke="#00f0ff" stroke-width="1.5" filter="url(#softGlow2)" />
      <circle cx="22" cy="21" r="5" fill="#10b981" />
      <text x="34" y="25" fill="#f9fafb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Nemo</text>
      <text x="74" y="25" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11">Listening...</text>
      <rect x="186" y="10" width="42" height="22" rx="11" fill="#1e293b" />
      <text x="207" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">STOP</text>
    </g>

    <text x="140" y="275" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      "Hey Nemo, snip the error"
    </text>
    <text x="140" y="295" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
      Auto-hides during movies &amp; full-screen gaming
    </text>
  </g>
</svg>