<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .win-bg { fill: #0b0d14; }
      .win-border { stroke: #1e2638; stroke-width: 1; fill: none; }
      .bar-bg { fill: #0f1420; }
      .bar-title { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #64748b; }
      .dot { fill: #334155; }
      .prompt { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; fill: #38bdf8; font-weight: 600; }
      .cmd { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; fill: #f8fafc; }
      .comment { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #475569; }
      .green { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; fill: #10b981; }
      .muted { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .dim { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #64748b; }
      .cyan { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="960" height="480" rx="8" class="win-bg" />
  <rect width="960" height="480" rx="8" class="win-border" />

  <!-- Window Titlebar -->
  <rect width="960" height="36" rx="8" class="bar-bg" />
  <rect y="28" width="960" height="8" class="bar-bg" />
  <line x1="0" y1="36" x2="960" y2="36" stroke="#1e2638" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="18" r="4.5" class="dot" />
  <circle cx="36" cy="18" r="4.5" class="dot" />
  <circle cx="52" cy="18" r="4.5" class="dot" />
  <text x="480" y="22" text-anchor="middle" class="bar-title">pwsh — nemo runtime session</text>

  <!-- Terminal Session Output -->
  <g transform="translate(28, 64)">
    <!-- Command 1: DB Inspect -->
    <text x="0" y="0" class="prompt">PS D:\Nemo&gt; </text>
    <text x="110" y="0" class="cmd">nemo db inspect ./analytics.db --tables</text>
    
    <text x="0" y="22" class="green">✓</text>
    <text x="16" y="22" class="muted">Connected to SQLite database: 4 tables discovered in 2.8ms</text>
    
    <text x="16" y="42" class="dim">├─ users        [id INTEGER PK, email TEXT UNIQUE, tier TEXT, created_at DATETIME]</text>
    <text x="16" y="58" class="dim">├─ events       [id INTEGER PK, user_id INTEGER FK, action TEXT, latency_ms REAL]</text>
    <text x="16" y="74" class="dim">└─ deployments  [id TEXT PK, commit_sha TEXT, status TEXT, passed_tests INTEGER]</text>
    <text x="16" y="94" class="cyan">→ Read-only safety guard: active (mutations locked)</text>

    <!-- Divider line -->
    <line x1="0" y1="112" x2="904" y2="112" stroke="#151d2c" stroke-width="1" />

    <!-- Command 2: API & Webhook Test -->
    <text x="0" y="136" class="prompt">PS D:\Nemo&gt; </text>
    <text x="110" y="136" class="cmd">nemo api test https://api.internal/v1/webhook -d '{"event":"release"}'</text>
    
    <text x="0" y="158" class="green">✓</text>
    <text x="16" y="158" class="muted">POST 200 OK  [latency: 34ms]  [bytes: 142]  [content-type: application/json]</text>
    <text x="16" y="176" class="dim">{ "acknowledged": true, "event_id": "evt_7a9f14", "queued_workers": 2 }</text>

    <!-- Divider line -->
    <line x1="0" y1="194" x2="904" y2="194" stroke="#151d2c" stroke-width="1" />

    <!-- Command 3: AST Codebase Symbols -->
    <text x="0" y="218" class="prompt">PS D:\Nemo&gt; </text>
    <text x="110" y="218" class="cmd">nemo ast symbols src/tools/database_inspector.py</text>
    
    <text x="0" y="240" class="green">✓</text>
    <text x="16" y="240" class="muted">Parsed AST tree: 1 class, 4 methods, 9 references resolved in 6.4ms</text>
    <text x="16" y="258" class="dim">├─ class DatabaseInspector(BaseTool)  [L14-L128]</text>
    <text x="16" y="274" class="dim">│  ├─ inspect_schema(db_path: str) -&gt; SchemaReport  [calls: sqlite3.connect, pragma_table_info]</text>
    <text x="16" y="290" class="dim">│  └─ execute_readonly_query(sql: str) -&gt; QueryResult  [guard: check_sql_safety]</text>

    <!-- Divider line -->
    <line x1="0" y1="308" x2="904" y2="308" stroke="#151d2c" stroke-width="1" />

    <!-- Command 4: Deploy & Verify -->
    <text x="0" y="332" class="prompt">PS D:\Nemo&gt; </text>
    <text x="110" y="332" class="cmd">nemo deploy --verify</text>
    
    <text x="0" y="354" class="green">✓</text>
    <text x="16" y="354" class="muted">Pre-flight checks: 0 hardcoded secrets found, git working tree clean</text>
    <text x="0" y="372" class="green">✓</text>
    <text x="16" y="372" class="muted">Regression test gate: 42/42 tests passing (pytest 0.62s)</text>
    <text x="0" y="390" class="green">✓</text>
    <text x="16" y="390" class="cyan">Deployed to Netlify: https://nemo-runtime.netlify.app</text>
  </g>
</svg>
