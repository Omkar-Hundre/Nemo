<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <radialGradient id="archBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1524" />
      <stop offset="100%" stop-color="#05080f" />
    </radialGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="orangeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #8b9bb4; }
      .item { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #cbd5e1; }
      .pill { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#archBg)" stroke="#1a263d" stroke-width="1.5" />

  <!-- Section Header -->
  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    NEMO Autonomous Voice &amp; Windows Operating Architecture
  </text>
  <text x="480" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#00f0ff">
    End-to-End Execution Flow • Sub-200ms Local Inference • Ground-Truth Verified
  </text>

  <!-- 4 Columns / Blocks -->
  
  <!-- Column 1: Audio Ingestion -->
  <g transform="translate(40, 90)">
    <rect width="200" height="340" rx="12" fill="#090d16" stroke="url(#cyanBorder)" stroke-width="1.5" />
    <rect x="12" y="14" width="60" height="20" rx="4" fill="#00f0ff" opacity="0.15" />
    <text x="18" y="28" fill="#00f0ff" class="pill">LAYER 1</text>
    <text x="14" y="58" class="title">Audio Engine</text>
    <text x="14" y="78" class="desc">Real-time local voice pipeline</text>
    
    <g transform="translate(14, 105)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">🎙️ WASAPI 44.1kHz</text>
      <text x="10" y="36" class="desc">Zero-clip ring buffer</text>
    </g>
    <g transform="translate(14, 158)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">🌊 WebRTC VAD</text>
      <text x="10" y="36" class="desc">Noise &amp; silence gating</text>
    </g>
    <g transform="translate(14, 211)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">⚡ Wake-Word 'Nemo'</text>
      <text x="10" y="36" class="desc">Sub-syllable detector</text>
    </g>
    <g transform="translate(14, 264)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#00f0ff" stroke-width="1" />
      <text x="10" y="24" class="item" fill="#00f0ff">🧠 Whisper INT8</text>
      <text x="10" y="36" class="desc">Sub-200ms local STT</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 245 260 L 265 260" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 2: Idempotency & Queue -->
  <g transform="translate(270, 90)">
    <rect width="200" height="340" rx="12" fill="#090d16" stroke="#1f2d45" stroke-width="1.5" />
    <rect x="12" y="14" width="60" height="20" rx="4" fill="#ff7a00" opacity="0.15" />
    <text x="18" y="28" fill="#ff7a00" class="pill">LAYER 2</text>
    <text x="14" y="58" class="title">Queue &amp; Policy</text>
    <text x="14" y="78" class="desc">Concurrency &amp; idempotency</text>

    <g transform="translate(14, 105)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">🔒 Semantic Hash</text>
      <text x="10" y="36" class="desc">15s duplicate debounce</text>
    </g>
    <g transform="translate(14, 158)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#ff3b00" stroke-width="1" />
      <text x="10" y="24" class="item" fill="#ff7a00">🛑 Tier 1: Control</text>
      <text x="10" y="36" class="desc">'stop', 'cancel', 'pause'</text>
    </g>
    <g transform="translate(14, 211)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">📊 Tier 2: Query</text>
      <text x="10" y="36" class="desc">Parallel background reads</text>
    </g>
    <g transform="translate(14, 264)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">⚙️ Tier 3: Task</text>
      <text x="10" y="36" class="desc">FIFO mutating action queue</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 475 260 L 495 260" stroke="#00f0ff" stroke-width="2" />

  <!-- Column 3: Agent Orchestrator -->
  <g transform="translate(500, 90)">
    <rect width="200" height="340" rx="12" fill="#090d16" stroke="url(#cyanBorder)" stroke-width="1.5" />
    <rect x="12" y="14" width="60" height="20" rx="4" fill="#00f0ff" opacity="0.15" />
    <text x="18" y="28" fill="#00f0ff" class="pill">LAYER 3</text>
    <text x="14" y="58" class="title">Agent Brain</text>
    <text x="14" y="78" class="desc">Autonomous reasoning engine</text>

    <g transform="translate(14, 105)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">🤖 Nemotron 120B</text>
      <text x="10" y="36" class="desc">Autonomous planning</text>
    </g>
    <g transform="translate(14, 158)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">🧠 Session Memory</text>
      <text x="10" y="36" class="desc">Vector DB project context</text>
    </g>
    <g transform="translate(14, 211)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#10b981" stroke-width="1" />
      <text x="10" y="24" class="item" fill="#10b981">🛡️ Verification Gate</text>
      <text x="10" y="36" class="desc">Zero-hallucination test check</text>
    </g>
    <g transform="translate(14, 264)">
      <rect width="172" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="10" y="24" class="item">🗣️ Microsoft SAPI</text>
      <text x="10" y="36" class="desc">Concise voice feedback</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 705 260 L 725 260" stroke="#00f0ff" stroke-width="2" />

  <!-- Column 4: Execution Plane -->
  <g transform="translate(730, 90)">
    <rect width="190" height="340" rx="12" fill="#090d16" stroke="url(#orangeBorder)" stroke-width="1.5" />
    <rect x="12" y="14" width="60" height="20" rx="4" fill="#ff7a00" opacity="0.15" />
    <text x="18" y="28" fill="#ff7a00" class="pill">LAYER 4</text>
    <text x="14" y="58" class="title">Windows Native</text>
    <text x="14" y="78" class="desc">Hardware &amp; GUI execution</text>

    <g transform="translate(12, 105)">
      <rect width="166" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="8" y="24" class="item">✂️ Snip &amp; Sketch</text>
      <text x="8" y="36" class="desc">Vision crop &amp; web fix</text>
    </g>
    <g transform="translate(12, 158)">
      <rect width="166" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="8" y="24" class="item">🎨 Jarvis Canvas</text>
      <text x="8" y="36" class="desc">Mathematical PIL shapes</text>
    </g>
    <g transform="translate(12, 211)">
      <rect width="166" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="8" y="24" class="item">🖥️ Terminal 3-Pane</text>
      <text x="8" y="36" class="desc">Backend, frontend, logs</text>
    </g>
    <g transform="translate(12, 264)">
      <rect width="166" height="42" rx="6" fill="#121a2b" stroke="#1f2d45" />
      <text x="8" y="24" class="item">📹 DirectShow Cam</text>
      <text x="8" y="36" class="desc">Headless webcam capture</text>
    </g>
  </g>
</svg>