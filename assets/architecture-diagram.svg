<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0a0d14; }
      .frame { stroke: #1e2638; stroke-width: 1; fill: none; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .header-sub { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #64748b; }
      .col-box { fill: #0e131f; stroke: #1e293b; stroke-width: 1; }
      .col-header { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; }
      .node-card { fill: #131a29; stroke: #232f46; stroke-width: 1; }
      .node-card-active { fill: #131e33; stroke: #0284c7; stroke-width: 1; }
      .node-name { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .wire { stroke: #334155; stroke-width: 1.5; fill: none; }
      .wire-active { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .arrow { fill: #334155; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="380" rx="8" class="bg" />
  <rect width="960" height="380" rx="8" class="frame" />

  <!-- Title Row -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" class="header-title">Nemo Runtime Architecture</text>
    <text x="0" y="20" class="header-sub">Deterministic pipeline: intent parsing → context graph → tool matrix → verification</text>
  </g>

  <!-- Column 1: Ingestion -->
  <g transform="translate(36, 76)">
    <rect width="200" height="270" rx="6" class="col-box" />
    <text x="16" y="24" class="col-header">01 / INGESTION</text>

    <!-- Node 1.1: CLI -->
    <g transform="translate(14, 40)">
      <rect width="172" height="64" rx="4" class="node-card" />
      <text x="12" y="24" class="node-name">CLI Commands</text>
      <text x="12" y="44" class="node-desc">Direct terminal prompts &amp; flags</text>
    </g>

    <!-- Node 1.2: Terminal IPC -->
    <g transform="translate(14, 114)">
      <rect width="172" height="64" rx="4" class="node-card" />
      <text x="12" y="24" class="node-name">Workspace Context</text>
      <text x="12" y="44" class="node-desc">Auto-discovery of git &amp; files</text>
    </g>

    <!-- Node 1.3: Voice Layer -->
    <g transform="translate(14, 188)">
      <rect width="172" height="64" rx="4" class="node-card" />
      <text x="12" y="24" class="node-name">Local Whisper INT8</text>
      <text x="12" y="44" class="node-desc">Optional hands-free input</text>
    </g>
  </g>

  <!-- Connectors 1 -> 2 -->
  <path d="M 236 148 L 268 148" class="wire" />
  <polygon points="268,145 274,148 268,151" class="arrow" />

  <path d="M 236 222 L 254 222 L 254 180 L 268 180" class="wire" />
  <polygon points="268,177 274,180 268,183" class="arrow" />

  <path d="M 236 296 L 254 296 L 254 212 L 268 212" class="wire" />
  <polygon points="268,209 274,212 268,215" class="arrow" />

  <!-- Column 2: Context Graph & Normalizer -->
  <g transform="translate(276, 76)">
    <rect width="200" height="270" rx="6" class="col-box" />
    <text x="16" y="24" class="col-header">02 / CONTEXT GRAPH</text>

    <!-- Node 2.1: AST Codebase Parser -->
    <g transform="translate(14, 40)">
      <rect width="172" height="64" rx="4" class="node-card" />
      <text x="12" y="24" class="node-name">AST Symbol Graph</text>
      <text x="12" y="44" class="node-desc">Function &amp; class dependencies</text>
    </g>

    <!-- Node 2.2: Schema Introspector -->
    <g transform="translate(14, 114)">
      <rect width="172" height="64" rx="4" class="node-card" />
      <text x="12" y="24" class="node-name">Schema Introspector</text>
      <text x="12" y="44" class="node-desc">SQLite &amp; SQL table mapping</text>
    </g>

    <!-- Node 2.3: Idempotency Lock -->
    <g transform="translate(14, 188)">
      <rect width="172" height="64" rx="4" class="node-card" />
      <text x="12" y="24" class="node-name">Intent Normalizer</text>
      <text x="12" y="44" class="node-desc">Deduplication &amp; state cache</text>
    </g>
  </g>

  <!-- Connectors 2 -> 3 -->
  <path d="M 476 180 L 508 180" class="wire" />
  <polygon points="508,177 514,180 508,183" class="arrow" />

  <!-- Column 3: Tool Matrix -->
  <g transform="translate(516, 76)">
    <rect width="200" height="270" rx="6" class="col-box" />
    <text x="16" y="24" class="col-header">03 / TOOL MATRIX</text>

    <g transform="translate(14, 36)">
      <rect width="172" height="38" rx="4" class="node-card" />
      <text x="10" y="23" class="node-name">database_inspector</text>
    </g>
    <g transform="translate(14, 80)">
      <rect width="172" height="38" rx="4" class="node-card" />
      <text x="10" y="23" class="node-name">api_tester (HTTP/ms)</text>
    </g>
    <g transform="translate(14, 124)">
      <rect width="172" height="38" rx="4" class="node-card" />
      <text x="10" y="23" class="node-name">git_operations</text>
    </g>
    <g transform="translate(14, 168)">
      <rect width="172" height="38" rx="4" class="node-card" />
      <text x="10" y="23" class="node-name">system_inspector (RAM)</text>
    </g>
    <g transform="translate(14, 212)">
      <rect width="172" height="38" rx="4" class="node-card" />
      <text x="10" y="23" class="node-name">desktop_integration</text>
    </g>
  </g>

  <!-- Connectors 3 -> 4 -->
  <path d="M 716 180 L 748 180" class="wire" />
  <polygon points="748,177 754,180 748,183" class="arrow" />

  <!-- Column 4: Verification Gate -->
  <g transform="translate(756, 76)">
    <rect width="168" height="270" rx="6" class="col-box" />
    <text x="16" y="24" class="col-header">04 / VERIFY &amp; RUN</text>

    <!-- Node 4.1: Syntax & Gate -->
    <g transform="translate(12, 40)">
      <rect width="144" height="64" rx="4" class="node-card" />
      <text x="10" y="24" class="node-name">Syntax Check</text>
      <text x="10" y="44" class="node-desc">AST validity test</text>
    </g>

    <!-- Node 4.2: Test Verification -->
    <g transform="translate(12, 114)">
      <rect width="144" height="64" rx="4" class="node-card-active" />
      <text x="10" y="24" class="node-name" fill="#38bdf8">Regression Gate</text>
      <text x="10" y="44" class="node-desc">42/42 tests verified</text>
    </g>

    <!-- Node 4.3: Terminal Result -->
    <g transform="translate(12, 188)">
      <rect width="144" height="64" rx="4" class="node-card" />
      <text x="10" y="24" class="node-name">Atomic Execution</text>
      <text x="10" y="44" class="node-desc">Safe state applied</text>
    </g>
  </g>
</svg>
